server:
  port: 8083

spring:
  application:
    name: petfriends-transporte

  datasource:
    url: jdbc:h2:mem:transportedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  cloud:
    function:
      definition: pedidoDespachadoConsumer
    stream:
      defaultBinder: rabbit
      bindings:
        pedidoDespachadoConsumer-in-0:
          destination: pedidos-despachados
          group: transporte-group

logging:
  level:
    org.springframework.cloud.stream: INFO
