server:
  port: 8082

spring:
  application:
    name: petfriends-almoxarifado

  datasource:
    url: jdbc:h2:mem:almoxdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  cloud:
    function:
      definition: pedidoFechadoConsumer
    stream:
      defaultBinder: rabbit
      bindings:
        pedidoFechadoConsumer-in-0:
          destination: pedidos-fechados
          group: almoxarifado-group

logging:
  level:
    org.springframework.cloud.stream: INFO
